name: Offline validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      product:
        type: string
        default: all
      bundle_products:
        type: string
        default: ''
      bundle_version:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: offline-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux offline checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Discover Python and embedded Bash checks
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - name: Text sanitizer and Unix artifact permissions
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 or later is required.' }
          ./obfuscation/tests/obfuscatefile.Tests.ps1

  windows:
    name: Windows offline checks
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Windows PowerShell 5.1 parser and Defender helpers
        run: |
          if ($PSVersionTable.PSEdition -ne 'Desktop' -or $PSVersionTable.PSVersion -lt [version]'5.1') { throw 'Windows PowerShell 5.1 is required.' }
          ./tests/check-admin-tools.ps1
      # Each step starts a fresh process so the MECM mocks cannot leak between suites.
      - name: MECM syntax
        run: ./mecm/tests/check-syntax.ps1
      - name: MECM collection control flow
        run: ./mecm/tests/check-collections.ps1
      - name: MECM application duplicate guard
        run: ./mecm/tests/check-application-duplicates.ps1
      - name: WSUS export path and failure guards
        run: ./mecm/tests/check-wsus-export.ps1
      - name: Text sanitizer synthetic regressions
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 or later is required.' }
          ./obfuscation/tests/obfuscatefile.Tests.ps1

  krbtgt:
    name: KRBTGT offline release gates
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare versioned development dependencies
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          if (-not (Get-PackageProvider -Name NuGet -ListAvailable -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force
          }
          foreach ($dependency in @(@{ Name = 'Pester'; Version = '3.4.0' }, @{ Name = 'PSScriptAnalyzer'; Version = '1.25.0' })) {
            if (-not (Get-Module -ListAvailable -Name $dependency.Name | Where-Object { $_.Version -eq [version]$dependency.Version })) {
              Install-Module -Name $dependency.Name -RequiredVersion $dependency.Version -Repository PSGallery -Scope CurrentUser -Force -AllowClobber
            }
          }
      - name: Verify committed hashes, syntax, analyzer and mocked behavior
        run: ./windows/reset-krbtgt/tools/Invoke-ReleaseVerification.ps1
      - name: KRBTGT receipt-directory policy regressions
        run: ./tests/check-krbtgt-evidence-guards.ps1

  mecm_clients:
    name: MECM client checks (${{ matrix.product }})
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { product: mecm-cache-cleanup, script: check-cache-cleanup.ps1 }
          - { product: mecm-ccmeval, script: check-ccmeval.ps1 }
          - { product: mecm-service-start, script: check-service-start.ps1 }
          - { product: mecm-computer-policy-refresh, script: check-computer-policy-refresh.ps1 }
          - { product: mecm-dns-cache-flush, script: check-dns-cache-flush.ps1 }
          - { product: mecm-time-sync, script: check-time-sync.ps1 }
          - { product: mecm-dns-registration, script: check-dns-registration.ps1 }
          - { product: mecm-agent-restart, script: check-agent-restart.ps1 }
          - { product: mecm-task-enable, script: check-task-enable.ps1 }
          - { product: mecm-staging-cleanup, script: check-staging-cleanup.ps1 }
          - { product: mecm-config-restore, script: check-config-restore.ps1 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise isolated synthetic behavior and timeout cases
        shell: powershell
        env:
          TEST_SCRIPT: ${{ matrix.script }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSEdition -ne 'Desktop' -or $PSVersionTable.PSVersion -lt [version]'5.1') { throw 'Windows PowerShell 5.1 is required.' }
          # Match Windows PowerShell 5.1 Tee-Object's UTF-16 encoding.
          Set-Content -LiteralPath mecm-test.log -Value ('Suite: ' + $env:TEST_SCRIPT) -Encoding Unicode
          try {
            & (Join-Path './mecm/tests' $env:TEST_SCRIPT) *>&1 | Tee-Object -FilePath mecm-test.log -Append
            if ($LASTEXITCODE -ne 0) { throw "Suite exited with code $LASTEXITCODE" }
          } catch {
            $_ | Out-String | Tee-Object -FilePath mecm-test.log -Append
            throw
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: test-${{ matrix.product }}
          path: mecm-test.log
          if-no-files-found: error
          retention-days: 14

  packages:
    name: Product package checks
    needs: [linux, windows, krbtgt, mecm_clients]
    # A skipped required check can satisfy branch protection. Always start this
    # required job and explicitly fail when any prerequisite did not succeed.
    if: ${{ always() }}
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Require every integration suite to succeed
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          KRBTGT_RESULT: ${{ needs.krbtgt.result }}
          MECM_RESULT: ${{ needs.mecm_clients.result }}
        run: |
          foreach ($result in @($env:LINUX_RESULT, $env:WINDOWS_RESULT, $env:KRBTGT_RESULT, $env:MECM_RESULT)) {
            if ($result -ne 'success') { throw "A required integration suite did not succeed: $result" }
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Packaging and release regressions
        run: bun test tools/release
      - name: Require versions for changed product payloads
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: bun tools/release/versions.ts
      - name: Build committed products and verify archives
        env:
          PRODUCT: ${{ inputs.product || 'all' }}
          BUNDLE_PRODUCTS: ${{ inputs.bundle_products }}
          BUNDLE_VERSION: ${{ inputs.bundle_version }}
        run: |
          $arguments = @('tools/release/package.ts', '--output', 'dist', '--product', $env:PRODUCT)
          if ($env:BUNDLE_PRODUCTS) { $arguments += @('--bundle-products', $env:BUNDLE_PRODUCTS) }
          if ($env:BUNDLE_VERSION) { $arguments += @('--bundle-version', $env:BUNDLE_VERSION) }
          & bun @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun tools/release/package.ts --verify dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: product-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
