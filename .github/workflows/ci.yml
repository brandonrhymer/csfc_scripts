name: Offline validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      product:
        type: string
        default: all
      bundle_products:
        type: string
        default: ''
      bundle_version:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: offline-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux offline checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Discover Python and embedded Bash checks
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - name: Text sanitizer and Unix artifact permissions
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 or later is required.' }
          ./obfuscation/tests/obfuscatefile.Tests.ps1

  windows:
    name: Windows offline checks
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Windows PowerShell 5.1 parser and Defender helpers
        run: |
          if ($PSVersionTable.PSEdition -ne 'Desktop' -or $PSVersionTable.PSVersion -lt [version]'5.1') { throw 'Windows PowerShell 5.1 is required.' }
          ./tests/check-admin-tools.ps1
      # Each step starts a fresh process so the MECM mocks cannot leak between suites.
      - name: MECM syntax
        run: ./mecm/tests/check-syntax.ps1
      - name: MECM collection control flow
        run: ./mecm/tests/check-collections.ps1
      - name: MECM application duplicate guard
        run: ./mecm/tests/check-application-duplicates.ps1
      - name: WSUS export path and failure guards
        run: ./mecm/tests/check-wsus-export.ps1
      - name: MECM client cache safety and timeout checks
        run: ./mecm/tests/check-cache-cleanup.ps1
      - name: MECM overdue CcmEval safety and timeout checks
        run: ./mecm/tests/check-ccmeval.ps1
      - name: Text sanitizer synthetic regressions
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 or later is required.' }
          ./obfuscation/tests/obfuscatefile.Tests.ps1

  krbtgt:
    name: KRBTGT offline release gates
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare versioned development dependencies
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          if (-not (Get-PackageProvider -Name NuGet -ListAvailable -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force
          }
          foreach ($dependency in @(@{ Name = 'Pester'; Version = '3.4.0' }, @{ Name = 'PSScriptAnalyzer'; Version = '1.25.0' })) {
            if (-not (Get-Module -ListAvailable -Name $dependency.Name | Where-Object { $_.Version -eq [version]$dependency.Version })) {
              Install-Module -Name $dependency.Name -RequiredVersion $dependency.Version -Repository PSGallery -Scope CurrentUser -Force -AllowClobber
            }
          }
      - name: Verify committed hashes, syntax, analyzer and mocked behavior
        run: ./windows/reset-krbtgt/tools/Invoke-ReleaseVerification.ps1

  packages:
    name: Product package checks
    needs: [linux, windows, krbtgt]
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Packaging and release regressions
        run: bun test tools/release
      - name: Require versions for changed product payloads
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: bun tools/release/versions.ts
      - name: Build committed products and verify archives
        env:
          PRODUCT: ${{ inputs.product || 'all' }}
          BUNDLE_PRODUCTS: ${{ inputs.bundle_products }}
          BUNDLE_VERSION: ${{ inputs.bundle_version }}
        run: |
          $arguments = @('tools/release/package.ts', '--output', 'dist', '--product', $env:PRODUCT)
          if ($env:BUNDLE_PRODUCTS) { $arguments += @('--bundle-products', $env:BUNDLE_PRODUCTS) }
          if ($env:BUNDLE_VERSION) { $arguments += @('--bundle-version', $env:BUNDLE_VERSION) }
          & bun @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun tools/release/package.ts --verify dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: product-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
