name: Script or maintenance request
description: Define an operator problem, bounded change and acceptance evidence.
title: "[Request] "
body:
  - type: markdown
    attributes:
      value: Keep all examples synthetic. A work request does not authorize running scripts against operational systems.
  - type: textarea
    id: problem
    attributes:
      label: Operator problem and desired result
      description: Describe the task, who performs it, and how completion will be recognized.
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Component and supported platform
      placeholder: MECM; Windows Server 2022; Windows PowerShell 5.1
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and boundaries
      description: Inputs, outputs, offline dependencies, allowed changes, preview behavior and recovery expectations. Omit actual environment values.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: Observable success and failure cases; distinguish source review, isolated tests and separately approved lab work.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Publication check
      options:
        - label: This request contains no private deployment information.
          required: true
