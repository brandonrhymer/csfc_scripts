name: Script defect
description: Report a reproducible source or behavior defect using synthetic details.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        This repository is public. Do not include real hosts, accounts, inventories, tokens, logs or screenshots from an operational environment. Report vulnerabilities through the [security policy](https://github.com/brandonrhymer/csfc_scripts/security/policy).
  - type: input
    id: component
    attributes:
      label: Script or component
      placeholder: windows/splunk/install-forwarder.ps1
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit and platform
      description: Commit SHA, OS and shell versions only; omit deployment identifiers.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Trigger and synthetic reproduction
      description: State whether this is source analysis, an offline test, or an approved lab observation. Do not rerun a mutating operation just to file an issue.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Include sanitized error text and the practical impact.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Publication check
      options:
        - label: This report contains synthetic details and no operational data or credentials.
          required: true
